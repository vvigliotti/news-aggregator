name: Update Headlines

on:
  schedule:
    - cron: '*/5 * * * *'  # Runs every 5 minutes (UTC)
  workflow_dispatch:

concurrency:
  group: update-headlines
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install feedparser jinja2 beautifulsoup4 pytz google-genai

      - name: Run updater script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
        run: python update.py

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add index.html daily_summary.json
          git status

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update headlines and daily summary"
            git push
          fi
